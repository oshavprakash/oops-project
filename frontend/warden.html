<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warden Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background-color: #f8eff6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        width: 615px;
        min-height: 700px;
        background-color: white;
        border-radius: 15px;
        padding: 75px 45px 40px;
        box-shadow: 0 8px 25px rgba(70, 30, 60, 0.15);
    }

    h1 {
        text-align: center;
        font-size: 50px;
        color: #3d1738;
        margin-bottom: 45px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        color: #555;
        font-size: 17px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-size: 22px;
        margin-bottom: 12px;
        color: #111;
    }

    input[type="email"],
    input[type="password"] {
        width: 100%;
        height: 59px;
        padding: 0 17px;
        font-size: 19px;
        border: 1px solid #777;
        border-radius: 3px;
        outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
        border: 2px solid #70405f;
    }

    input::placeholder {
        color: #777;
    }

    .options-row {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 5px;
        margin-bottom: 35px;
    }

    .options-row a {
        color: #70405f;
        font-size: 20px;
        text-decoration: underline;
    }

    .login-btn {
        width: 100%;
        height: 53px;
        background-color: #c894b7;
        color: #111;
        border: none;
        border-radius: 6px;
        font-size: 20px;
        cursor: pointer;
    }

    .login-btn:hover {
        background-color: #b982a8;
    }

    .footer-note {
        text-align: center;
        margin-top: 30px;
        font-size: 17px;
        color: #555;
    }

    .footer-note a {
        color: #70405f;
        text-decoration: underline;
    }

    .error-msg {
        background-color: #f8d7da;
        color: #842029;
        border: 1px solid #f5c2c7;
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
    }

    /* Forgot password page */
    #forgotForm .subtitle {
        line-height: 1.5;
        margin-bottom: 25px;
    }

    /* Responsive design */
    @media (max-width: 700px) {
        .login-card {
            width: 90%;
            min-height: auto;
            padding: 50px 30px 35px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 35px;
        }

        label {
            font-size: 19px;
        }

        input[type="email"],
        input[type="password"] {
            height: 55px;
            font-size: 17px;
        }
    }
</style>

</head>

<body>

<div class="login-card">

    <h1>Warden Login</h1>

    <p class="subtitle">Sign in with your warden credentials</p>

    <div id="errorMsg" class="error-msg" style="display:none;">
        Invalid email or password. Please try again.
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">

        <div class="form-group">
            <label for="wardenEmail">Warden Email</label>
            <input
                type="email"
                id="wardenEmail"
                name="wardenEmail"
                placeholder="warden@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="wardenPassword">Password</label>
            <input
                type="password"
                id="wardenPassword"
                name="wardenPassword"
                placeholder="Enter your password"
                required
            >
        </div>

        <div class="options-row">
            <a href="#" onclick="return showForgotPassword()">
                Forgot password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            Log In
        </button>

    </form>

    <!-- Forgot Password Form -->
    <form
        id="forgotForm"
        style="display:none;"
        onsubmit="return handleForgotPassword(event)"
    >

        <p class="subtitle">
            Enter your warden email to receive a password reset link.
        </p>

        <div class="form-group">
            <label for="resetEmail">Warden Email</label>

            <input
                type="email"
                id="resetEmail"
                name="resetEmail"
                placeholder="warden@example.com"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Send Reset Link
        </button>

        <p class="footer-note">
            <a href="#" onclick="return showLoginForm()">
                Back to login
            </a>
        </p>

    </form>

    <p class="footer-note" id="loginFooter">
        Authorized warden personnel only.
    </p>

</div>


<script>

function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById('wardenEmail').value;
    const password = document.getElementById('wardenPassword').value;

    console.log('Login attempt:', {
        email: email,
        password: password
    });

    alert('Login submitted (connect this form to your backend).');

    return false;
}


function handleForgotPassword(e) {
    e.preventDefault();

    const resetEmail =
        document.getElementById('resetEmail').value;

    console.log(
        'Password reset requested for:',
        resetEmail
    );

    alert(
        'If this email is registered, a reset link has been sent.'
    );

    showLoginForm();

    return false;
}


function showForgotPassword() {

    document.getElementById('loginForm').style.display = 'none';

    document.getElementById('forgotForm').style.display = 'block';

    document.getElementById('loginFooter').style.display = 'none';

    document.getElementById('errorMsg').style.display = 'none';

    return false;
}


function showLoginForm() {

    document.getElementById('forgotForm').style.display = 'none';

    document.getElementById('loginForm').style.display = 'block';

    document.getElementById('loginFooter').style.display = 'block';

    return false;
}


function showError() {

    document.getElementById('errorMsg').style.display = 'block';

}

</script>

</body>
</html>
