<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: rgb(245, 235, 242);
        }
        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(79, 42, 65, 0.2);
        }
        h1 {
            text-align: center;
            color: rgb(67, 41, 57);
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: rgb(201, 153, 183);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .options a {
            color: rgb(105, 63, 89);
        }
        .register {
            text-align: center;
            margin-top: 20px;
        }
        .register a {
            color: rgb(105, 63, 89);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Student Login</h1>
        <form onsubmit="login(event)">
            <label>Student ID / Username:</label>
            <input type="text"
                   id="studentId"
                   placeholder="Enter Username or ID"
                   required>
            
            <label>Password:</label>
            <input type="password"
                   id="studentPassword"
                   placeholder="Enter Password"
                   required>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>

                <a href="#" onclick="forgotPassword()">
                    Forgot Password?
                </a>
            </div>
            <br>

            <label>
                <input type="checkbox" onclick="showPassword()">
                Show Password
            </label>

            <button type="submit">
                Login
            </button>
            <div class="register">
                <p>New User?</p>
                <a href="register.html">Register here!</a>
            </div>
        </form>
    </div>

    <script>
        function showPassword() {
            let passwordInput = document.getElementById("studentPassword");
            if (passwordInput.type == "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        }

        window.onload = function() {
            let savedId = localStorage.getItem("studentId");
            if (savedId != null) {
                document.getElementById("studentId").value = savedId;
                document.getElementById("remember").checked = true;
            }
        };

        function login(event) {
            event.preventDefault();
            let inputId = document.getElementById("studentId").value.trim();
            let inputPassword = document.getElementById("studentPassword").value;

            // Warden login
            if (inputId === "warden123" && inputPassword === "Warden@123") {
                window.location.href = "warden.html";
                return;
            }

            // Fetch registered users from localStorage
            let users = JSON.parse(localStorage.getItem("hostelUsers")) || [];

            // Find if a matching user exists
            let matchedUser = users.find(u => (u.username === inputId || u.email === inputId) && u.password === inputPassword);

            if (!matchedUser) {
                alert("Invalid credentials or user not registered. Please register first!");
                return;
            }

            // Save the verified student's name for the dashboard greeting
            localStorage.setItem("studentName", matchedUser.username);

            if (document.getElementById("remember").checked) {
                localStorage.setItem("studentId", inputId);
            } else {
                localStorage.removeItem("studentId");
            }

            // Route securely to the student dashboard
            window.location.href = "Student.html";
        }

        function forgotPassword() {
            alert("Please contact your administrator to reset your password.");
        }
    </script>
</body>
</html>
