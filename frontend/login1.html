<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: rgb(245, 235, 242);
        }
        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(79, 42, 65, 0.2);
        }
        h1 {
            text-align: center;
            color: rgb(67, 41, 57);
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: rgb(201, 153, 183);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .options a {
            color: rgb(105, 63, 89);
        }
        .register {
            text-align: center;
            margin-top: 20px;
        }
        .register a {
            color: rgb(105, 63, 89);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Login</h1>
        <form onsubmit="login(event)">
            <label>Username:</label>
            <input type="text"
                   id="studentId"
                   placeholder="Enter Username or ID"
                   required>
            
            <label>Password:</label>
            <input type="password"
                   id="studentPassword"
                   placeholder="Enter Password"
                   required>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>

                <a href="#" onclick="forgotPassword()">
                    Forgot Password?
                </a>
            </div>
            <br>

            <label>
                <input type="checkbox" onclick="showPassword()">
                Show Password
            </label>

            <button type="submit">
                Login
            </button>
            <div class="register">
                <p>New User?</p>
                <a href="register.html">Register here!</a>
            </div>
        </form>
    </div>

    <script>
        function showPassword() {
            let passwordInput = document.getElementById("studentPassword");
            if (passwordInput.type == "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        }

        window.onload = function() {
            let savedId = localStorage.getItem("studentId");
            if (savedId != null) {
                document.getElementById("studentId").value = savedId;
                document.getElementById("remember").checked = true;
            }
        };

        function login(event) {
            event.preventDefault();
            let inputId = document.getElementById("studentId").value.trim();
            let inputPassword = document.getElementById("studentPassword").value;

            let params = new URLSearchParams();
            params.append("username", inputId);
            params.append("password", inputPassword);

            fetch("api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params.toString()
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(res => {
                let data = res.body;
                if (res.status === 200 && data.success) {
                    if (data.userName) {
                        localStorage.setItem("studentName", data.userName);
                    }
                    if (document.getElementById("remember").checked) {
                        localStorage.setItem("studentId", inputId);
                    } else {
                        localStorage.removeItem("studentId");
                    }
                    window.location.href = data.redirect || "Student.html";
                } else {
                    alert(data.message || "Invalid credentials. Please try again.");
                }
            })
            .catch(error => {
                console.error("Login error:", error);
                alert("Unable to reach backend server. Please verify the server is running.");
            });
        }

        function forgotPassword() {
            alert("Please contact your hostel administrator to reset your password.");
        }
    </script>
</body>
</html>
