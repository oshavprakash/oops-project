
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hostel Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5edf4;
            font-family: Arial, sans-serif;
            padding: 20px 0;
        }

        .register-container {
            width: 474px;
            padding: 36px 35px;
            background: #ffffff;
            border-radius: 11px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin: 10px 0 26px;
            text-align: center;
            font-size: 36px;
            color: #382044;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            color: #111;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            margin-bottom: 17px;
            border: 1px solid #777;
            border-radius: 0;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c994b5;
        }

        input::placeholder {
            color: #777;
        }

        button {
            width: 100%;
            height: 43px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            background-color: #c994b5;
            color: #000;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #bd83a7;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-text {
            margin-top: 23px;
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
        }

        .login-text a {
            display: block;
            margin-top: 10px;
            color: #734061;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 550px) {
            .register-container {
                width: calc(100% - 30px);
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>Register</h2>

        <form id="registerForm" onsubmit="validateRegister(event)">

            <label for="username">Student ID:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter College Student ID"
                maxlength="10"
                required
            >

            <label for="fullname">Full Name:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter Full Name"
                maxlength="100"
                required
            >

            <label for="email">Email ID:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email ID"
                maxlength="100"
                required
            >

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password:</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="registerButton">Register</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login1.html">Login</a>
        </p>

    </div>

    <script>
        async function validateRegister(event) {
            event.preventDefault();

            const studentID = document.getElementById("username").value.trim();
            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const registerButton = document.getElementById("registerButton");

            // Validate student ID
            if (studentID.length === 0 || studentID.length > 10) {
                alert("Student ID must contain 1 to 10 characters.");
                return;
            }

            // Validate full name
            if (fullname.length === 0) {
                alert("Please enter your full name.");
                return;
            }

            // Validate password length
            if (password.length < 8) {
                alert("Password must be at least 8 characters long.");
                return;
            }

            // Password must contain an uppercase letter
            if (!/[A-Z]/.test(password)) {
                alert("Password must contain an uppercase letter.");
                return;
            }

            // Password must contain a lowercase letter
            if (!/[a-z]/.test(password)) {
                alert("Password must contain a lowercase letter.");
                return;
            }

            // Password must contain a number
            if (!/[0-9]/.test(password)) {
                alert("Password must contain a number.");
                return;
            }

            // Password must contain a special character
            if (!/[!@#$%^&*]/.test(password)) {
                alert("Password must contain a special character.");
                return;
            }

            // Check password confirmation
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            const params = new URLSearchParams();
            params.append("studentID", studentID);
            params.append("name", fullname);
            params.append("email", email);
            params.append("password", password);

            registerButton.disabled = true;
            registerButton.textContent = "Registering...";

            try {
                const response = await fetch("https://hostelconnect-backend-za3a.onrender.com/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: params.toString()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                if (data.success) {
                    alert(data.message || "Registration successful!");
                    window.location.href = "login1.html";
                } else {
                    alert(data.message || "Registration failed. Please try again.");
                }

            } catch (error) {
                console.error("Registration error:", error);

                alert(
                    error.message ||
                    "Unable to reach the backend. Please check that the server is running."
                );

            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Register";
            }
        }
    </script>

</body>
</html>
