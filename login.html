<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: rgb(245, 235, 242);
        }
        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(79, 42, 65, 0.2);
        }
        h1 {
            text-align: center;
            color: rgb(67, 41, 57);
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: rgb(201, 153, 183);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .options a {
            color: rgb(105, 63, 89);
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Student Login</h1>
        <form onsubmit="login(event)">
            <label>Student ID:</label>
            <input type="text"
                   id="studentId"
                   placeholder="Enter Student ID"
                   required>
            
            <label>Password:</label>
            
            <input type="password"
                   id="studentPassword"
                   placeholder="Enter Password"
                   required>
            <div class="options">

                <label>
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>

                <a href="#" onclick="forgotPassword()">
                    Forgot Password?
                </a>

            </div>
            <br>

            <label>
                <input type="checkbox" onclick="showPassword()">
                Show Password
            </label>

            <button type="submit">
                Login
            </button>

        </form>

    </div>
    <script>

        function showPassword() {

            let passwordInput =
                document.getElementById("studentPassword");

            if (passwordInput.type == "password") {

                passwordInput.type = "text";

            }
            else {

                passwordInput.type = "password";

            }

        }
        window.onload = function() {
            let savedId =
                localStorage.getItem("studentId");

            if (savedId != null) {
                document.getElementById("studentId").value = savedId;
                document.getElementById("remember").checked = true;
            }
        };

        function login(event) {
            event.preventDefault();
            let id =
                document.getElementById("studentId").value;
            let password =
                document.getElementById("studentPassword").value;
            if (password.length < 7) {
                alert("Password must be at least 8 characters long.");
                return;
            }
            if (!/[A-Z]/.test(password)) {
                alert("Password must contain an uppercase letter.");
                return;
            }
            if (!/[a-z]/.test(password)) {
                alert("Password must contain a lowercase letter.");
                return;
            }
            if (!/[0-9]/.test(password)) {
                alert("Password must contain a number.");
                return;
            }
            if (!/[!@#$%^&*]/.test(password)) {
                alert("Password must contain a special character.");
                return;
            }
            if (document.getElementById("remember").checked) {
                localStorage.setItem("studentId", id);
            }
            else {
                localStorage.removeItem("studentId");
            }
            alert("Login successful!");
        }
        function forgotPassword() {
            alert("Please contact your administrator to reset your password.");
        }
    </script>
</body>
</html
